<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Diagnóstico — Claudio Alecrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0a;
    --card:      #111111;
    --card2:     #161616;
    --borda:     #1e1e1e;
    --borda2:    #2a2a2a;
    --texto:     #e8e0d4;
    --texto2:    #9a8a7a;
    --texto3:    #5a4a3a;
    --acento:    #c8a97a;
    --acento2:   #a88a5a;
    --verde:     #4a9e6e;
    --amarelo:   #c8a97a;
    --laranja:   #c87a4a;
    --vermelho:  #c84a4a;
    --radius:    10px;
    --font-disp: 'Cormorant Garamond', serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--texto);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── CONTAINER ─────────────────────────────── */
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ── HEADER ─────────────────────────────────── */
  .header {
    padding: 40px 20px 32px;
    text-align: center;
    border-bottom: 1px solid var(--borda);
  }
  .header-logo {
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--acento);
    margin-bottom: 20px;
  }
  .header h1 {
    font-family: var(--font-disp);
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 300;
    color: var(--texto);
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .header p {
    font-size: 15px;
    color: var(--texto2);
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── PROGRESSO ──────────────────────────────── */
  .progress-wrap {
    padding: 20px 20px 0;
    max-width: 640px;
    margin: 0 auto;
  }
  .progress-bar {
    height: 1px;
    background: var(--borda2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--acento);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texto3);
    text-align: right;
  }

  /* ── STEPS ──────────────────────────────────── */
  .step { display: none; padding: 32px 20px; max-width: 640px; margin: 0 auto; }
  .step.ativo { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── BLOCO DE PERGUNTAS ─────────────────────── */
  .bloco-titulo {
    font-family: var(--font-body);
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--acento);
    margin-bottom: 8px;
  }
  .bloco-nome {
    font-family: var(--font-disp);
    font-size: 26px;
    font-weight: 300;
    color: var(--texto);
    margin-bottom: 6px;
  }
  .bloco-desc {
    font-size: 14px;
    color: var(--texto2);
    margin-bottom: 28px;
    line-height: 1.6;
  }

  /* ── PERGUNTA ───────────────────────────────── */
  .pergunta { margin-bottom: 28px; }
  .pergunta-texto {
    font-size: 15px;
    color: var(--texto);
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .pergunta-num {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--texto3);
    margin-bottom: 6px;
  }

  /* ── OPÇÕES ─────────────────────────────────── */
  .opcoes { display: flex; flex-direction: column; gap: 8px; }
  .opcao {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .opcao:hover { border-color: var(--borda2); background: var(--card2); }
  .opcao input[type="radio"] { display: none; }
  .opcao-letra {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--borda2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    letter-spacing: 0;
    color: var(--texto3);
    transition: all 0.2s;
    margin-top: 1px;
  }
  .opcao-texto { font-size: 14px; color: var(--texto2); line-height: 1.5; }
  .opcao.selecionada {
    border-color: var(--acento2);
    background: #1a1510;
  }
  .opcao.selecionada .opcao-letra {
    background: var(--acento);
    border-color: var(--acento);
    color: #0a0a0a;
    font-weight: 500;
  }
  .opcao.selecionada .opcao-texto { color: var(--texto); }

  /* ── CAMPOS DE DADOS PESSOAIS ───────────────── */
  .campo { margin-bottom: 20px; }
  .campo label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texto2);
    margin-bottom: 8px;
  }
  .campo input, .campo select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--texto);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .campo input:focus, .campo select:focus { border-color: var(--acento2); }
  .campo input::placeholder { color: var(--texto3); }

  /* ── AVISO ──────────────────────────────────── */
  .aviso {
    background: #0f0d0a;
    border: 1px solid #2a2010;
    border-left: 3px solid var(--acento);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 13px;
    color: var(--texto2);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* ── BOTÕES ─────────────────────────────────── */
  .btn-wrap { display: flex; gap: 12px; margin-top: 32px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--acento); color: #0a0a0a; flex: 1; }
  .btn-primary:hover { background: var(--acento2); }
  .btn-primary:disabled { background: var(--borda2); color: var(--texto3); cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--texto2);
    border: 1px solid var(--borda);
    padding: 14px 20px;
  }
  .btn-ghost:hover { border-color: var(--borda2); color: var(--texto); }

  /* ── LOADING ────────────────────────────────── */
  .loading {
    display: none;
    padding: 60px 20px;
    text-align: center;
    max-width: 640px;
    margin: 0 auto;
  }
  .loading.ativo { display: block; }
  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 2px solid var(--borda2);
    border-top-color: var(--acento);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-texto {
    font-family: var(--font-disp);
    font-size: 22px;
    font-weight: 300;
    color: var(--texto);
    margin-bottom: 8px;
  }
  .loading-sub { font-size: 13px; color: var(--texto2); }

  /* ── RESULTADO ──────────────────────────────── */
  .resultado {
    display: none;
    padding: 32px 20px 60px;
    max-width: 640px;
    margin: 0 auto;
  }
  .resultado.ativo { display: block; animation: fadeIn 0.5s ease; }

  .resultado-header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--borda);
  }
  .resultado-tag {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--acento);
    margin-bottom: 8px;
  }
  .resultado-titulo {
    font-family: var(--font-disp);
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 300;
    color: var(--texto);
    line-height: 1.2;
  }

  /* Eixos visuais */
  .eixos-wrap { margin-bottom: 32px; }
  .eixo-item { margin-bottom: 16px; }
  .eixo-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .eixo-label { font-size: 13px; color: var(--texto2); letter-spacing: 0.5px; }
  .eixo-nivel {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .eixo-barra { height: 2px; background: var(--borda2); border-radius: 2px; overflow: hidden; }
  .eixo-fill { height: 100%; border-radius: 2px; transition: width 1s ease 0.3s; }

  /* Card de resultado */
  .resultado-card {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .resultado-card-tag {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--acento);
    margin-bottom: 6px;
  }
  .resultado-card-titulo {
    font-family: var(--font-disp);
    font-size: 20px;
    font-weight: 400;
    color: var(--texto);
    margin-bottom: 12px;
  }
  .resultado-card-texto {
    font-size: 15px;
    color: var(--texto2);
    line-height: 1.8;
    white-space: pre-wrap;
  }

  /* Devolutiva IA */
  .devolutiva-wrap {
    border-top: 1px solid var(--borda);
    padding-top: 28px;
    margin-top: 8px;
  }
  .devolutiva-tag {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--texto3);
    margin-bottom: 20px;
  }
  .devolutiva-texto {
    font-size: 16px;
    color: var(--texto);
    line-height: 1.9;
    white-space: pre-wrap;
  }

  /* Erro */
  .erro-wrap {
    background: #1a0808;
    border: 1px solid #3a1010;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #c84a4a;
  }

  /* ── VALIDAÇÃO VISUAL ───────────────────────── */
  .pergunta.nao-respondida .pergunta-texto { color: var(--vermelho); }
  .pergunta.nao-respondida .opcao:first-of-type { border-color: #3a1010; }

  /* ── RESPONSIVO ─────────────────────────────── */
  @media (max-width: 480px) {
    .btn-wrap { flex-direction: column; }
    .btn-ghost { order: 2; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo" id="header-logo">Claudio Alecrim</div>
  <h1 id="header-titulo">Carregando...</h1>
  <p id="header-desc"></p>
</div>

<!-- BARRA DE PROGRESSO -->
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="progress-label" id="progress-label"></div>
</div>

<!-- STEPS DINÂMICOS (gerados por JS) -->
<div id="steps-container"></div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-texto">Lendo seu perfil...</div>
  <div class="loading-sub">Seu resultado chegará em instantes e também será enviado para seu email</div>
</div>

<!-- RESULTADO -->
<div class="resultado" id="resultado">
  <div class="resultado-header">
    <div class="resultado-tag" id="res-tag">Seu diagnóstico</div>
    <div class="resultado-titulo" id="res-titulo"></div>
  </div>

  <!-- Eixos visuais -->
  <div class="eixos-wrap" id="res-eixos"></div>

  <!-- Cards de ferida e temperamento -->
  <div id="res-cards"></div>

  <!-- Devolutiva IA -->
  <div class="devolutiva-wrap" id="res-devolutiva-wrap" style="display:none">
    <div class="devolutiva-tag">Análise · Gerada para você</div>
    <div class="devolutiva-texto" id="res-devolutiva-texto"></div>
  </div>

  <!-- Erro da IA (se houver) -->
  <div class="erro-wrap" id="res-erro" style="display:none"></div>
</div>

<!-- ── SCRIPTS ───────────────────────────────────────────── -->
<script src="calculos.js"></script>
<script src="prompt.js"></script>
<!-- A ferramenta específica sobrescreve window.FERRAMENTA_CONFIG -->
<script src="ferramenta.js"></script>

<script>
// ============================================================
// MOTOR — motor.html (lógica principal)
// ============================================================

let stepAtual = 0;
let respostas = {};
let totalSteps = 0;
let dadosPessoais = {};

// ── INICIALIZAR ──────────────────────────────────────────────
function init() {
  const cfg = window.FERRAMENTA_CONFIG;
  if (!cfg) { alert('Nenhuma ferramenta configurada. Crie o arquivo ferramenta.js.'); return; }

  document.title = cfg.nome + ' — ' + cfg.autor;
  document.getElementById('page-title').textContent = cfg.nome;
  document.getElementById('header-logo').textContent = cfg.autor;
  document.getElementById('header-titulo').textContent = cfg.titulo;
  document.getElementById('header-desc').textContent = cfg.descricao;

  gerarSteps(cfg);
  totalSteps = cfg.blocos.length + 1; // +1 para dados pessoais
  mostrarStep(0);
}

// ── GERAR STEPS DINAMICAMENTE ────────────────────────────────
function gerarSteps(cfg) {
  const container = document.getElementById('steps-container');

  // Step 0: Dados pessoais
  const stepDados = criarStepDados(cfg);
  container.appendChild(stepDados);

  // Steps dos blocos de perguntas
  cfg.blocos.forEach((bloco, i) => {
    const stepBloco = criarStepBloco(bloco, i + 1);
    container.appendChild(stepBloco);
  });
}

function criarStepDados(cfg) {
  const div = document.createElement('div');
  div.className = 'step';
  div.id = 'step-0';
  div.innerHTML = `
    <div class="bloco-titulo">Antes de começar</div>
    <div class="bloco-nome">Identificação</div>
    <div class="bloco-desc">Seus dados são usados apenas para personalizar sua devolutiva.</div>
    <div class="campo">
      <label>Nome completo</label>
      <input type="text" id="campo-nome" placeholder="Como você se chama?" autocomplete="off">
    </div>
    <div class="campo">
      <label>E-mail</label>
      <input type="email" id="campo-email" placeholder="seu@email.com" autocomplete="off">
    </div>
    ${cfg.camposExtras ? cfg.camposExtras.map(c => `
    <div class="campo" id="campo-wrap-${c.id}">
      <label>${c.label}</label>
      ${c.tipo === 'select'
        ? `<select id="campo-${c.id}" onchange="onCampoChange('${c.id}', this.value)">${c.opcoes.map(o => `<option value="${o.valor}">${o.label}</option>`).join('')}</select>`
        : `<input type="${c.tipo}" id="campo-${c.id}" placeholder="${c.placeholder || ''}">`
      }
    </div>`).join('') : ''}
    <div class="campo" id="campo-wrap-religiao" style="display:none">
      <label>Qual religião você professa?</label>
      <input type="text" id="campo-religiao" placeholder="Escreva aqui..." autocomplete="off">
    </div>
    ${cfg.aviso ? `<div class="aviso">${cfg.aviso}</div>` : ''}
    <div class="btn-wrap">
      <button class="btn btn-primary" onclick="avancarDados()">Começar</button>
    </div>
  `;
  return div;
}

function criarStepBloco(bloco, stepNum) {
  const div = document.createElement('div');
  div.className = 'step';
  div.id = `step-${stepNum}`;

  let html = `
    <div class="bloco-titulo">${bloco.categoria || 'Perguntas'}</div>
    <div class="bloco-nome">${bloco.nome}</div>
    <div class="bloco-desc">${bloco.descricao || ''}</div>
  `;

  bloco.perguntas.forEach((p, i) => {
    const letras = ['A', 'B', 'C', 'D'];
    html += `
      <div class="pergunta" id="pq-${p.id}">
        <div class="pergunta-num">${String(i + 1).padStart(2, '0')}</div>
        <div class="pergunta-texto">${p.texto}</div>
        <div class="opcoes">
          ${p.opcoes.map((o, j) => `
          <label class="opcao" id="opcao-${p.id}-${j}">
            <input type="radio" name="${p.id}" value="${j}" onchange="selecionarOpcao('${p.id}', ${j})">
            <span class="opcao-letra">${letras[j]}</span>
            <span class="opcao-texto">${o}</span>
          </label>`).join('')}
        </div>
      </div>
    `;
  });

  html += `
    <div class="btn-wrap">
      ${stepNum > 1 ? `<button class="btn btn-ghost" onclick="voltarStep()">Voltar</button>` : ''}
      <button class="btn btn-primary" id="btn-avancar-${stepNum}" onclick="avancarBloco(${stepNum})">
        ${stepNum < (window.FERRAMENTA_CONFIG?.blocos?.length || 1) ? 'Continuar' : 'Ver meu diagnóstico'}
      </button>
    </div>
  `;

  div.innerHTML = html;
  return div;
}

// ── NAVEGAÇÃO ────────────────────────────────────────────────
function mostrarStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('ativo'));
  const s = document.getElementById(`step-${n}`);
  if (s) s.classList.add('ativo');
  stepAtual = n;
  atualizarProgresso();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function atualizarProgresso() {
  const pct = totalSteps > 0 ? Math.round((stepAtual / totalSteps) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent =
    stepAtual === 0 ? '' : `${stepAtual} de ${totalSteps}`;
}

function onCampoChange(id, valor) {
  if (id === 'tempo_fe') {
    const wrap = document.getElementById('campo-wrap-religiao');
    if (wrap) wrap.style.display = valor === 'nao_sou' ? 'block' : 'none';
  }
}

function avancarDados() {
  const nome = document.getElementById('campo-nome')?.value?.trim();
  const email = document.getElementById('campo-email')?.value?.trim();
  if (!nome || !email) { alert('Por favor, preencha nome e e-mail para continuar.'); return; }

  dadosPessoais.nome = nome;
  dadosPessoais.email = email;

  const cfg = window.FERRAMENTA_CONFIG;
  if (cfg.camposExtras) {
    cfg.camposExtras.forEach(c => {
      dadosPessoais[c.id] = document.getElementById(`campo-${c.id}`)?.value;
    });
  }
  // Capturar religião se visível
  const religiao = document.getElementById('campo-religiao')?.value?.trim();
  if (religiao) dadosPessoais.religiao = religiao;

  mostrarStep(1);
}

function avancarBloco(stepNum) {
  const cfg = window.FERRAMENTA_CONFIG;
  const bloco = cfg.blocos[stepNum - 1];

  // Validar que todas as perguntas foram respondidas
  const naoRespondidas = bloco.perguntas.filter(p => respostas[p.id] === undefined);
  if (naoRespondidas.length > 0) {
    naoRespondidas.forEach(p => {
      const el = document.getElementById(`pq-${p.id}`);
      if (el) { el.classList.add('nao-respondida'); setTimeout(() => el.classList.remove('nao-respondida'), 2000); }
    });
    const primeiro = document.getElementById(`pq-${naoRespondidas[0].id}`);
    if (primeiro) primeiro.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  if (stepNum < cfg.blocos.length) {
    mostrarStep(stepNum + 1);
  } else {
    finalizarDiagnostico();
  }
}

function voltarStep() {
  if (stepAtual > 0) mostrarStep(stepAtual - 1);
}

function selecionarOpcao(perguntaId, valor) {
  respostas[perguntaId] = valor;
  // Atualizar visual
  document.querySelectorAll(`[id^="opcao-${perguntaId}-"]`).forEach(el => el.classList.remove('selecionada'));
  document.getElementById(`opcao-${perguntaId}-${valor}`)?.classList.add('selecionada');
}

// ── FINALIZAR E GERAR RESULTADO ──────────────────────────────
async function finalizarDiagnostico() {
  // Esconder steps, mostrar loading
  document.querySelectorAll('.step').forEach(s => s.classList.remove('ativo'));
  document.getElementById('loading').classList.add('ativo');
  atualizarProgresso();

  const cfg = window.FERRAMENTA_CONFIG;
  const relatorio = Calculos.gerarRelatorio(respostas, cfg);

  // Montar resultado visual
  exibirResultadoVisual(relatorio, cfg);

  // Chamar backend (IA + email)
  await chamarBackend(relatorio, cfg);

  // Esconder loading, mostrar resultado
  document.getElementById('loading').classList.remove('ativo');
  document.getElementById('resultado').classList.add('ativo');
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = 'Concluído';
}

function exibirResultadoVisual(relatorio, cfg) {
  const { eixos, niveis, ferida, temperamento } = relatorio;
  const nome = dadosPessoais.nome?.split(' ')[0] || 'você';

  document.getElementById('res-titulo').textContent = cfg.tituloResultado
    ? cfg.tituloResultado.replace('{nome}', nome)
    : `Diagnóstico de ${nome}`;

  // Eixos visuais
  const eixosWrap = document.getElementById('res-eixos');
  eixosWrap.innerHTML = '';
  cfg.eixos?.forEach(e => {
    const dados  = eixos[e.id];
    const nivel  = niveis[e.id]; // agora é { nivel, label, cor }
    const div    = document.createElement('div');
    div.className = 'eixo-item';
    div.innerHTML = `
      <div class="eixo-top">
        <span class="eixo-label">${e.label}</span>
        <span class="eixo-nivel" style="color:${nivel.cor}">${nivel.label}</span>
      </div>
      <div class="eixo-barra">
        <div class="eixo-fill" style="width:0%;background:${nivel.cor}" data-width="${dados.percentual}%"></div>
      </div>
    `;
    eixosWrap.appendChild(div);
  });

  // Animar barras
  setTimeout(() => {
    document.querySelectorAll('.eixo-fill').forEach(b => {
      b.style.width = b.dataset.width;
    });
  }, 100);

  // Cards de ferida e temperamento
  const cardsWrap = document.getElementById('res-cards');
  cardsWrap.innerHTML = '';

  if (ferida) {
    const f = Prompt.FERIDAS[ferida.predominante];
    cardsWrap.innerHTML += `
      <div class="resultado-card">
        <div class="resultado-card-tag">Ferida predominante</div>
        <div class="resultado-card-titulo">${f.nome} · ${f.mascara}</div>
        <div class="resultado-card-texto">${f.descricao}</div>
      </div>
    `;
  }

  if (temperamento) {
    const t = Prompt.TEMPERAMENTOS[temperamento.dominante];
    cardsWrap.innerHTML += `
      <div class="resultado-card">
        <div class="resultado-card-tag">Temperamento dominante</div>
        <div class="resultado-card-titulo">${t.nome}</div>
        <div class="resultado-card-texto">${t.descricao}\n\nSombra: ${t.sombra}</div>
      </div>
    `;
  }
}

async function chamarBackend(relatorio, cfg) {
  try {
    const res = await fetch('/api/enviar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        dados: dadosPessoais,
        relatorio
      })
    });

    const data = await res.json();

    if (data.devolutiva) {
      document.getElementById('res-devolutiva-texto').textContent = data.devolutiva;
      document.getElementById('res-devolutiva-wrap').style.display = 'block';
    } else {
      throw new Error(data.erro || 'Sem resposta do servidor');
    }
  } catch (err) {
    const erroEl = document.getElementById('res-erro');
    erroEl.textContent = 'O resultado visual está disponível acima. A análise personalizada será enviada por email em instantes.';
    erroEl.style.display = 'block';
  }
}
